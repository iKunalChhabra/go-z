<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>go-zod — Zod for Go</title>
    <meta
      name="description"
      content="go-zod is a native Go port of Zod v4 — same patterns, same errors, fluent schemas, Gin-ready, and built for concurrency."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070b14" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("go-zod-theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='28' font-weight='900' fill='%23ffffff'%3Ez%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" type="button">☰</button>
      <a class="brand" href="#/">
        <span class="brand-mark">z</span>
        <span class="brand-text">go-<span>zod</span></span>
      </a>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Search docs…" autocomplete="off" />
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
        <a class="btn btn-ghost" href="https://github.com/iKunalChhabra/go-zod" target="_blank" rel="noreferrer">GitHub</a>
        <a class="btn btn-primary" href="#/guide/installation">Get started</a>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content">
        <article class="prose" id="content">

        <nav class="pager" id="pager" hidden></nav>
      </main>

    </div>

    <div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
      <div class="search-panel">
        <input id="searchModalInput" type="search" placeholder="Search go-zod docs…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
        <div class="search-hints">
          <span><kbd>⌘</kbd><kbd>K</kbd> open</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

</html>
